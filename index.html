<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator♡✦</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         BACKGROUND DECORATIONS
         ===================================================== -->

    <div class="bg-decoration deco-star star-1">✦</div>
    <div class="bg-decoration deco-star star-2">★</div>
    <div class="bg-decoration deco-star star-3">✧</div>

    <div class="bg-decoration deco-heart heart-1">♥</div>
    <div class="bg-decoration deco-heart heart-2">♡</div>

    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✧</div>
    <div class="sparkle sparkle-3">✦</div>
    <div class="sparkle sparkle-4">★</div>


    <!-- =====================================================
         CALCULATOR
         ===================================================== -->

    <main class="calculator-wrapper">

        <div class="calculator">

            <!-- Header -->
            <div class="calculator-header">

                <div class="header-stars">
                    ★ ★ ★
                </div>

                <div class="title">
                    <span>♡</span>
                    CALCULATOR
                    <span>♡</span>
                </div>

                <div class="subtitle">
                    カルキュレーター
                </div>

            </div>


            <!-- =================================================
                 DISPLAY
                 ================================================= -->

            <div class="display-container">

                <div class="display-sparkle">
                    ✦
                </div>

                <div
                    class="history"
                    id="history">
                </div>

                <div
                    class="display"
                    id="display">
                    0
                </div>

            </div>


            <!-- =================================================
                 BUTTONS
                 ================================================= -->

            <div class="buttons">

                <!-- Row 1 -->

                <button
                    class="btn function clear"
                    data-action="clear">

                    C

                </button>


                <button
                    class="btn function"
                    data-action="delete">

                    DEL

                </button>


                <button
                    class="btn function"
                    data-action="percent">

                    %

                </button>


                <button
                    class="btn operator"
                    data-operator="/">

                    ÷

                </button>


                <!-- Row 2 -->

                <button
                    class="btn number"
                    data-number="7">

                    7

                </button>


                <button
                    class="btn number"
                    data-number="8">

                    8

                </button>


                <button
                    class="btn number"
                    data-number="9">

                    9

                </button>


                <button
                    class="btn operator"
                    data-operator="*">

                    ×

                </button>


                <!-- Row 3 -->

                <button
                    class="btn number"
                    data-number="4">

                    4

                </button>


                <button
                    class="btn number"
                    data-number="5">

                    5

                </button>


                <button
                    class="btn number"
                    data-number="6">

                    6

                </button>


                <button
                    class="btn operator"
                    data-operator="-">

                    −

                </button>


                <!-- Row 4 -->

                <button
                    class="btn number"
                    data-number="1">

                    1

                </button>


                <button
                    class="btn number"
                    data-number="2">

                    2

                </button>


                <button
                    class="btn number"
                    data-number="3">

                    3

                </button>


                <button
                    class="btn operator"
                    data-operator="+">

                    +

                </button>


                <!-- Row 5 -->

                <button
                    class="btn function"
                    data-action="sign">

                    ±

                </button>


                <button
                    class="btn number"
                    data-number="0">

                    0

                </button>


                <button
                    class="btn number"
                    data-action="decimal">

                    .

                </button>


                <button
                    class="btn equals"
                    data-action="equals">

                    =

                </button>

            </div>


            <!-- Footer -->

            <div class="calculator-footer">
                <span>
                    ✦ HAVE FUN! ✦
                </span>
            </div>

        </div>

    </main>


    <!-- Copyright -->

    <div class="copyright">
        made by nire
    </div>


    <script src="script.js"></script>

</body>
</html>
